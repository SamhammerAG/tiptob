version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
      - dependency-name: "*"
        dependency-type: production
      - dependency-name: "@tiptap/*"
    groups:
      tiptap:
        patterns:
          - "@tiptap/*"
